spring.application.name=foodloop-backend

# Server port configuration - Render assigns PORT dynamically
server.port=${PORT:8080}

# Database configuration with local development fallbacks
# Supports both unified SPRING_DATASOURCE_URL and discrete DB_HOST/DB_PORT/DB_NAME variables
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:foodloop}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:connector}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate schema management
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# JWT configuration. Override JWT_SECRET via environment variable in production (must be >= 32 chars)
app.jwt.secret=${JWT_SECRET:FoodLoopSecretKeyForJWTAuthentication123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# CORS allowed origins (comma-separated). Set CORS_ALLOWED_ORIGINS in Render to your deployed frontend URL
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}