spring.application.name=foodloop-backend
server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/foodloop
spring.datasource.username=root
spring.datasource.password=connector
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT configuration. Override JWT_SECRET via an environment variable in
# production; the fallback value is for local development only.
app.jwt.secret=${JWT_SECRET:FoodLoopSecretKeyForJWTAuthentication123456789}
app.jwt.expiration-ms=3600000