spring.application.name=foodloop-backend

# Server port configuration - Render assigns PORT dynamically
server.port=${PORT:8080}

# Database configuration with local development fallbacks
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/foodloop}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:connector}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate schema management
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT configuration. Override JWT_SECRET via environment variable in production (must be >= 32 chars)
app.jwt.secret=${JWT_SECRET:FoodLoopSecretKeyForJWTAuthentication123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# CORS allowed origins (comma-separated). Set CORS_ALLOWED_ORIGINS in Render to your Netlify URL
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}